name: B
on: push
jobs:
  b:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - run: ls -la
    - run: cat aimlock_ios_complete.mm | head -5
    - run: clang++ -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -framework Foundation -framework UIKit -framework IOKit -framework CoreGraphics -mios-version-min=12.0 -o a aimlock_ios_complete.mm
    - run: ls -la a
    - run: file a
    - run: mkdir -p P/a.app
    - run: cp a P/a.app/
    - run: echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>a</string><key>CFBundleIdentifier</key><string>c.i</string><key>CFBundleName</key><string>A</string><key>CFBundleVersion</key><string>1</string><key>CFBundlePackageType</key><string>APPL</string><key>LSRequiresIPhoneOS</key><true/></dict></plist>' > P/a.app/Info.plist
    - run: zip -r i.ipa P/
    - run: ls -la i.ipa
    - uses: actions/upload-artifact@v4
      with:
        name: i
        path: i.ipa
